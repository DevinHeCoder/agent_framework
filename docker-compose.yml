# Agent Framework 编排部署：app + redis（双缓存长时记忆）
#
# 用法:
#   docker compose up --build
#   curl http://localhost:8001/health
#
# 说明:
#   - 默认 memory.provider=hybrid（短时内存 + 长时 Redis 冷热分层）；
#     可通过环境变量 AGENT_MEMORY_PROVIDER 覆盖。
#   - 默认 LLM 为 fake（演示）；配真实 LLM 时设置 AGENT_LLM_* 环境变量。
#   - 端口说明：宿主机 8001→容器 8000（与同机 rag-engine 的 8000 错开）；
#     redis 暴露 6380 仅供调试，业务访问走 compose 内部网络。
services:
  agent-app:
    build: .
    container_name: agent-app
    ports:
      - "8001:8000"
    environment:
      AGENT_MEMORY_PROVIDER: ${AGENT_MEMORY_PROVIDER:-hybrid}
      AGENT_REDIS_URL: redis://redis:6379/0
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-fake}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-}
      AGENT_AUTH_ENABLED: ${AGENT_AUTH_ENABLED:-false}
      AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:-}
      AGENT_AUTH_RATE_LIMIT: ${AGENT_AUTH_RATE_LIMIT:-60}
      AGENT_BRAND_APP_NAME: ${AGENT_BRAND_APP_NAME:-}
      AGENT_BRAND_LOGO_TEXT: ${AGENT_BRAND_LOGO_TEXT:-}
      AGENT_BRAND_LOGO_SUFFIX: ${AGENT_BRAND_LOGO_SUFFIX:-}
      AGENT_BRAND_AGENT_LABEL: ${AGENT_BRAND_AGENT_LABEL:-}
      AGENT_BRAND_PRIMARY_COLOR: ${AGENT_BRAND_PRIMARY_COLOR:-}
      AGENT_BRAND_ACCENT_COLOR: ${AGENT_BRAND_ACCENT_COLOR:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - default
      - rag_engine

  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:

# 复用同机 rag_engine 的外部网络：nginx（rag-landing）可直接以 agent-app 域名反代
networks:
  rag_engine:
    external: true
    name: rag_engine_default

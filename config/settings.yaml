# ==================== Agent Framework 全局配置 ====================
# 说明：
#   1. ${ENV_VAR} 或 ${ENV_VAR:默认值} 会被环境变量展开，用于注入密钥等敏感信息；
#      未设置且无默认值时启动即报错（ConfigError），避免静默用错配置。
#   2. 环境变量 AGENT_LLM__MODEL=x 可覆盖下方任意路径（前缀 AGENT_ + 双下划线分隔层级）。
#   3. 各层的 name 字段（tool/memory/llm/planner/agent 等）即“可插拔”的选型开关，
#      对应各层 Registry 中注册的实现名。

app:
  name: agent_framework
  version: 0.1.0

# 白标化：交付客户时通过 .env 覆盖，前端控制台品牌随之变化
branding:
  # 页面标题副名 / 页脚描述
  app_name: "${AGENT_BRAND_APP_NAME:轻量智能 Agent 工具编排框架}"
  # 左上角 Logo 主文字（默认 AGENT）
  logo_text: "${AGENT_BRAND_LOGO_TEXT:AGENT}"
  # Logo 主文字后的后缀（默认 ·控制台）
  logo_suffix: "${AGENT_BRAND_LOGO_SUFFIX:·控制台}"
  # 消息气泡里的助手角色标签
  agent_label: "${AGENT_BRAND_AGENT_LABEL:AGENT}"
  # 品牌主色 / 强调色（十六进制，替换控制台配色）
  primary_color: "${AGENT_BRAND_PRIMARY_COLOR:#4F8CFF}"
  accent_color: "${AGENT_BRAND_ACCENT_COLOR:#22D3EE}"

# 日志配置路径（相对项目根）
logging:
  config_path: config/logging.yaml

# ---------------- P1 工具层（可插拔注册中心）----------------
tool:
  # 需要注册并暴露给 LLM 的工具列表（对应 tool_registry 中注册的实现名）
  enabled: ["calc", "time", "weather", "kb_search"]
  # 工具执行失败时的全局重试次数
  retry: 2
  # 参数校验失败后允许回喂 LLM 重新生成的次数
  param_fix_attempts: 2

# ---------------- P2 记忆层（短时 + 长时双缓存）----------------
memory:
  # 记忆选型：in_memory | redis | hybrid（双缓存组合）
  provider: ${AGENT_MEMORY_PROVIDER:in_memory}
  short_term:
    provider: in_memory
    window_size: 20          # 短时滑动窗口保留的消息条数
  long_term:
    provider: redis
    ttl_seconds: 86400       # 长时记忆 TTL（默认 1 天）
    redis_url: ${AGENT_REDIS_URL:redis://localhost:6379/0}

# ---------------- P3 LLM 客户端层（可插拔选型）----------------
llm:
  # provider: openai_compatible | fake（无 key 演示/测试）
  provider: ${AGENT_LLM_PROVIDER:fake}
  base_url: ${AGENT_LLM_BASE_URL:}
  api_key: ${AGENT_LLM_API_KEY:}
  model: ${AGENT_LLM_MODEL:}
  temperature: 0.2
  max_tokens: 1024

# ---------------- P4 规划层（任务拆解 / 多步规划）----------------
planner:
  provider: llm              # llm | none（不拆解直接执行）
  max_steps: 6               # 单次任务最大规划步数

# ---------------- P4 Agent 核心层 ----------------
agent:
  provider: react            # react（ReAct 循环）
  max_loop: 5                # 最大工具调用轮次，防止死循环
  json_parse_retries: 2      # LLM 输出 JSON 解析失败的最大重试轮次

# ---------------- P5 服务 ----------------
server:
  host: 0.0.0.0
  port: 8000
  # API 鉴权（客户环境务必开启，防止公网盗刷 LLM 额度）
  auth:
    # 开启后除 /health、/api/v1/system 外的 API 均要求 X-API-Key 请求头
    enabled: ${AGENT_AUTH_ENABLED:false}
    # 访问令牌；enabled=true 时必须设置，否则所有请求被拒
    token: ${AGENT_AUTH_TOKEN:}
    # 频率限制：同一 Key 每分钟最大请求数（0 = 不限流）
    rate_limit_per_minute: ${AGENT_AUTH_RATE_LIMIT:60}

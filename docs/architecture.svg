<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <!-- 标题 -->
  <text x="20" y="28" font-size="18" font-weight="600" fill="#1A1B1C">轻量智能 Agent 工具编排框架 · 分层架构</text>
  <text x="20" y="46" font-size="12" fill="#6B7280">分层 + Registry 可插拔 + YAML 选型 · 统一工程形式</text>

  <!-- P5 API -->
  <rect x="20" y="60" width="520" height="62" rx="12" fill="#EAF3FB" stroke="#A3D5E8"/>
  <text x="40" y="86" font-size="15" font-weight="600" fill="#1A1B1C">P5 API 服务层</text>
  <text x="40" y="106" font-size="12" fill="#4B5563">FastAPI · POST /api/v1/chat · GET /api/v1/tools · /health · 会话管理（SessionManager）</text>
  <text x="560" y="88" font-size="12" fill="#1A1B1C" font-weight="600">需求④ 会话持久化</text>
  <text x="560" y="106" font-size="11" fill="#6B7280">多轮连续任务</text>

  <!-- P4 Agent -->
  <rect x="20" y="132" width="520" height="62" rx="12" fill="#F0ECFA" stroke="#C9A7E8"/>
  <text x="40" y="158" font-size="15" font-weight="600" fill="#1A1B1C">P4 Agent 核心</text>
  <text x="40" y="178" font-size="12" fill="#4B5563">ReactAgent（plan → 工具执行 → 回答）· RetryPolicy（指数退避重试 / 参数自愈 / 失败兜底）</text>
  <text x="560" y="160" font-size="12" fill="#1A1B1C" font-weight="600">需求⑤ 异常容错</text>
  <text x="560" y="178" font-size="11" fill="#6B7280">重试 · 自愈 · 兜底</text>

  <!-- P4 Planner -->
  <rect x="20" y="204" width="520" height="62" rx="12" fill="#FDF3E7" stroke="#E1B98F"/>
  <text x="40" y="230" font-size="15" font-weight="600" fill="#1A1B1C">P4 规划层</text>
  <text x="40" y="250" font-size="12" fill="#4B5563">LLMPlanner · LLM 任务拆解 · 自动选择工具 · max_steps 截断 · JSON 容错解析</text>
  <text x="560" y="232" font-size="12" fill="#1A1B1C" font-weight="600">需求② 任务拆解</text>
  <text x="560" y="250" font-size="11" fill="#6B7280">多步规划 · 自动选工具</text>

  <!-- P3 LLM -->
  <rect x="20" y="276" width="520" height="62" rx="12" fill="#E8F8F1" stroke="#94D8C3"/>
  <text x="40" y="302" font-size="15" font-weight="600" fill="#1A1B1C">P3 LLM 客户端</text>
  <text x="40" y="322" font-size="12" fill="#4B5563">fake（无 Key 驱动全链路） · openai_compatible（OpenAI 兼容协议：DeepSeek/通义/豆包）</text>
  <text x="560" y="304" font-size="11" fill="#6B7280">可插拔选型</text>

  <!-- P1 Tool + P2 Memory 并排 -->
  <rect x="20" y="348" width="252" height="62" rx="12" fill="#FEF6F7" stroke="#EAA7B2"/>
  <text x="40" y="374" font-size="15" font-weight="600" fill="#1A1B1C">P1 工具注册中心</text>
  <text x="40" y="394" font-size="12" fill="#4B5563">calc · time · weather · kb_search<br/>参数校验 · 可插拔 @register</text>
  <text x="560" y="372" font-size="12" fill="#1A1B1C" font-weight="600">需求① 工具注册</text>
  <text x="560" y="390" font-size="11" fill="#6B7280">可插拔 · 统一校验</text>

  <rect x="288" y="348" width="252" height="62" rx="12" fill="#EFFAF9" stroke="#94D4D0"/>
  <text x="308" y="374" font-size="15" font-weight="600" fill="#1A1B1C">P2 双缓存记忆</text>
  <text x="308" y="394" font-size="12" fill="#4B5563">in_memory（短时滑动窗口） · redis（长时 TTL） · hybrid 冷热分层</text>
  <text x="560" y="412" font-size="12" fill="#1A1B1C" font-weight="600">需求③ 双缓存</text>
  <text x="560" y="430" font-size="11" fill="#6B7280">短时 + 长时</text>

  <!-- P0 公共 -->
  <rect x="20" y="420" width="520" height="62" rx="12" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="40" y="446" font-size="15" font-weight="600" fill="#1A1B1C">P0 公共基础设施</text>
  <text x="40" y="466" font-size="12" fill="#4B5563">泛型 Registry · 分层异常体系 · YAML 配置加载（${ENV} 展开）· 日志 · JSON 容错解析</text>

  <!-- 数据流箭头 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>
  <line x1="280" y1="60" x2="280" y2="122" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="132" x2="280" y2="194" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="204" x2="280" y2="266" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="276" x2="280" y2="338" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="348" x2="280" y2="410" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 底部 -->
  <rect x="20" y="500" width="720" height="44" rx="12" fill="#FBF7EC" stroke="#E4D48F"/>
  <text x="40" y="526" font-size="13" fill="#1A1B1C">需求全覆盖：① 通用工具注册中心 · ② LLM 任务拆解/多步规划/自动选工具 · ③ 短时+长时双缓存记忆 · ④ 会话状态持久化多轮连续 · ⑤ 异常重试/参数自愈/失败兜底</text>
</svg>
